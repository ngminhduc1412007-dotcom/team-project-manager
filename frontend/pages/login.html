<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | Student Project Hub</title>
  <link rel="icon" href="../assets/images/logo.png">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body data-root="../">
  <!-- Header dùng chung nạp qua layout.js -->
  <header id="app-header"></header>

  <main class="container">
      <div class="auth-card card">

        <!-- PHẦN 1: FORM ĐĂNG NHẬP (Mặc định hiển thị) -->
        <div id="login-section">
          <h2>Đăng nhập</h2>
          <p class="auth-subtitle">Đăng nhập vào hệ thống quản lý đồ án sinh viên</p>

            <form id="login-form" novalidate>
              <div class="form-group">
                <label for="login-email">Email sinh viên *</label>
                <input type="email" id="login-email" placeholder="VD: sinhvien@ptit.edu.vn">
                <div class="form-error" id="login-email-error"></div>
              </div>

              <div class="form-group">
                <label for="login-password">Mật khẩu *</label>
                <input type="password" id="login-password" placeholder="Tối thiểu 8 ký tự">
                <div class="form-error" id="login-password-error"></div>
              </div>

              <div style="margin-top: 20px;">
                <button type="submit" id="btn-login" class="btn btn-primary w-full">Đăng nhập</button>
              </div>
            </form>

            <!-- Tiện ích điền nhanh tài khoản mẫu -->
              <div class="quick-fill-box">
                <span style="font-size: 12px; color: var(--color-muted);">Tài khoản kiểm thử nhanh:</span><br>
                <button type="button" class="btn btn-small" id="btn-quick-fill" style="margin-top: 6px;">
                  Điền nhanh tài khoản mẫu
                </button>
              </div>

                <div class="auth-footer">
                  Chưa có tài khoản? <a href="javascript:void(0)" id="link-show-register"><strong>Đăng ký
                      ngay</strong></a>
                </div>
              </div>

              <!-- PHẦN 2: FORM ĐĂNG KÝ (Mặc định ẩn, chỉ hiện khi người dùng bấm Đăng ký ngay) -->
              <div id="register-section" style="display: none;">
                <h2>Tạo tài khoản mới</h2>
                <p class="auth-subtitle">Đăng ký tài khoản sinh viên để tham gia nhóm đồ án</p>

                <form id="register-form" novalidate>
                  <div class="form-group">
                    <label for="reg-fullname">Họ và tên sinh viên *</label>
                    <input type="text" id="reg-fullname" placeholder="VD: Nguyễn Văn A">
                    <div class="form-error" id="reg-fullname-error"></div>
                  </div>

                  <div class="form-group">
                    <label for="reg-email">Email sinh viên *</label>
                    <input type="email" id="reg-email" placeholder="VD: nguyenvana@ptit.edu.vn">
                    <div class="form-error" id="reg-email-error"></div>
                  </div>

                  <div class="form-group">
                    <label for="reg-password">Mật khẩu *</label>
                    <input type="password" id="reg-password" placeholder="Tối thiểu 8 ký tự">
                    <div class="form-error" id="reg-password-error"></div>
                  </div>

                  <div class="form-group">
                    <label for="reg-confirm">Nhập lại mật khẩu *</label>
                    <input type="password" id="reg-confirm" placeholder="Nhập lại chính xác mật khẩu trên">
                    <div class="form-error" id="reg-confirm-error"></div>
                  </div>

                  <div style="margin-top: 20px;">
                    <button type="submit" id="btn-register" class="btn btn-primary w-full">Đăng ký tài khoản</button>
                  </div>
                </form>

                <div class="auth-footer">
                  Đã có tài khoản? <a href="javascript:void(0)" id="link-show-login"><strong>Đăng nhập ngay</strong></a>
                </div>
              </div>

            </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/login.js"></script>
</body>

</html>
