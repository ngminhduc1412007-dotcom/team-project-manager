<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dự án của tôi | Student Project Hub</title>
  <link rel="icon" href="../assets/images/logo.png">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body data-root="../">
  <header id="app-header"></header>

  <main class="container">
    <!-- Tiêu đề trang & Nút hành động -->
    <div class="page-header">
      <div>
        <h1 style="margin: 0; font-size: 24px;">Dự án của tôi</h1>
        <p style="margin: 4px 0 0; color: var(--color-muted); font-size: 14px;">
          Quản lý tiến độ đồ án và phân công công việc các bài tập nhóm
        </p>
      </div>
      <div>
        <button id="btn-open-modal" class="btn btn-primary">+ Tạo dự án mới</button>
      </div>
    </div>

    <!-- Thanh tìm kiếm, lọc, sắp xếp và phân trang -->
    <div class="card" style="padding: 16px; margin-bottom: 20px;">
      <!-- Hàng 1: Tìm kiếm theo tên & Lọc Dự án của tôi -->
      <div
        style="display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px;">
        <div class="toolbar-search" style="flex: 1; min-width: 260px;">
          <input type="search" id="search-input" placeholder="🔍 Tìm theo tên hoặc mô tả đồ án...">
        </div>

        <!-- Toggle lọc dự án -->
        <div class="filter-group" id="my-filter-group">
          <button type="button" class="filter-btn active" data-my="false">🌐 Tất cả dự án</button>
          <button type="button" class="filter-btn" data-my="true" id="btn-filter-my">👤 Dự án của tôi</button>
        </div>
      </div>

      <!-- Hàng 2: Lọc trạng thái, Sắp xếp & Chọn số bản ghi mỗi trang -->
      <div
        style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--color-border); padding-top: 12px;">
        <!-- Lọc trạng thái -->
        <div class="filter-group" id="filter-group">
          <button type="button" class="filter-btn active" data-status="ALL">Tất cả</button>
          <button type="button" class="filter-btn" data-status="ACTIVE">Đang thực hiện</button>
          <button type="button" class="filter-btn" data-status="PLANNING">Lập kế hoạch</button>
          <button type="button" class="filter-btn" data-status="COMPLETED">Đã hoàn thành</button>
        </div>

        <!-- Nhóm sắp xếp & kích thước trang -->
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
          <label for="sort-by" style="font-size: 13px; color: var(--color-muted); white-space: nowrap;">Sắp
            xếp:</label>
          <select id="sort-by" style="width: auto; padding: 6px 10px; font-size: 13px;">
            <option value="created_at" selected>Ngày tạo</option>
            <option value="name">Tên dự án</option>
            <option value="deadline">Hạn chót</option>
            <option value="updated_at">Ngày cập nhật</option>
            <option value="id">Mã dự án</option>
          </select>

          <select id="sort-order" style="width: auto; padding: 6px 10px; font-size: 13px;">
            <option value="desc" selected>Giảm dần</option>
            <option value="asc">Tăng dần</option>
          </select>

          <label for="page-size"
            style="font-size: 13px; color: var(--color-muted); margin-left: 6px; white-space: nowrap;">Hiển
            thị:</label>
          <select id="page-size" style="width: auto; padding: 6px 10px; font-size: 13px;">
            <option value="6">6 / trang</option>
            <option value="10" selected>10 / trang</option>
            <option value="20">20 / trang</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Lưới thẻ dự án (Project Cards) -->
    <div id="project-grid" class="project-grid"></div>

    <!-- Trạng thái rỗng (Empty State) -->
    <div id="empty-state" class="empty-box" style="display: none;">
      <div class="empty-icon">📁</div>
      <div class="empty-title" id="empty-title">Chưa có dự án nào</div>
      <div class="empty-desc" id="empty-desc">Không tìm thấy dự án phù hợp với bộ lọc hiện tại.</div>
      <button id="btn-empty-create" class="btn btn-primary">+ Tạo dự án đầu tiên</button>
    </div>

    <!-- Thanh phân trang (Pagination) -->
    <div class="pagination-wrapper" id="pagination-wrapper" style="display: none;">
      <div class="pagination-info" id="pagination-info">
        Hiển thị 0 trên tổng số 0 dự án
      </div>
      <div class="pagination-controls" id="pagination-controls"></div>
    </div>
  </main>

  <!-- Modal Tạo Dự Án Mới -->
  <div class="modal-backdrop" id="create-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Tạo đồ án / dự án mới</h3>
        <button type="button" class="modal-close" id="btn-close-modal" aria-label="Đóng">&times;</button>
      </div>

      <form id="create-project-form" novalidate>
        <div class="form-group">
          <label for="project-name">Tên dự án / đề tài *</label>
          <input type="text" id="project-name" placeholder="VD: Website Quản lý Đồ án Sinh viên PTIT">
          <div class="form-error" id="name-error"></div>
        </div>

        <div class="form-group">
          <label for="project-desc">Mô tả tóm tắt</label>
          <textarea id="project-desc" rows="3" placeholder="Mục tiêu đồ án, công nghệ sử dụng..."></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label for="start-date">Ngày bắt đầu</label>
            <input type="date" id="start-date">
          </div>
          <div class="form-group">
            <label for="end-date">Hạn chót (Deadline)</label>
            <input type="date" id="end-date">
          </div>
        </div>

        <div class="form-group">
          <label for="project-status">Trạng thái ban đầu</label>
          <select id="project-status">
            <option value="PLANNING">Lập kế hoạch (PLANNING)</option>
            <option value="ACTIVE" selected>Đang thực hiện (ACTIVE)</option>
          </select>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn" id="btn-cancel-modal">Hủy bỏ</button>
          <button type="submit" class="btn btn-primary" id="btn-submit-project">Tạo dự án</button>
        </div>
      </form>
    </div>
  </div>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/projects.js"></script>
</body>

</html>
